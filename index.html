<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM Mathématiques - Factorisation & Développement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --bg:#0b0710;
  --bg-2:#15090f;
  --fg:#fff5e8;
  --muted:#a89a8c;
  --accent:#ff4d3d;
  --accent-2:#ffb547;
  --gold:#e8b04b;
  --success:#3ddc84;
  --error:#ff4757;
  --card:rgba(255,255,255,0.04);
  --border:rgba(255,181,71,0.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Outfit',sans-serif;
  background:var(--bg);
  color:var(--fg);
  overflow-x:hidden;
  position:relative;
  min-height:100vh;
}

/* Background atmosphère */
.bg-canvas{
  position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(255,77,61,0.18) 0%, transparent 45%),
    radial-gradient(ellipse at 80% 90%, rgba(255,181,71,0.14) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(232,176,75,0.06) 0%, transparent 70%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
}
.bg-symbols{
  position:fixed;inset:0;z-index:-1;
  pointer-events:none;
  overflow:hidden;
}
.symbol{
  position:absolute;
  font-family:'Fraunces',serif;
  color:rgba(255,181,71,0.08);
  font-weight:900;
  user-select:none;
  animation:floatUp linear infinite;
}
@keyframes floatUp{
  0%{transform:translateY(110vh) rotate(0deg);opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform:translateY(-15vh) rotate(360deg);opacity:0}
}

/* Header */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 40px;
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);
  background:rgba(11,7,16,0.6);
  position:sticky;top:0;z-index:100;
}
.logo-wrap{
  display:flex;align-items:center;gap:14px;
}
.logo-img{
  width:64px;height:64px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid var(--accent);
  box-shadow:0 0 25px rgba(255,77,61,0.5), inset 0 0 10px rgba(0,0,0,0.3);
  animation:logoSpin 18s linear infinite;
}
@keyframes logoSpin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
.logo-text{
  display:flex;flex-direction:column;line-height:1.1;
}
.logo-text .name{
  font-family:'Fraunces',serif;
  font-weight:900;
  font-size:18px;
  color:var(--accent-2);
  letter-spacing:1px;
}
.logo-text .sub{
  font-size:11px;
  color:var(--muted);
  letter-spacing:2px;
  text-transform:uppercase;
}
.prof{
  text-align:right;
}
.prof .label{
  font-size:11px;
  letter-spacing:3px;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:4px;
}
.prof .name{
  font-family:'Fraunces',serif;
  font-weight:900;
  font-size:24px;
  background:linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

/* Main */
main{
  max-width:1100px;
  margin:0 auto;
  padding:40px 30px 80px;
}

/* Intro screen */
.intro{
  text-align:center;
  padding:60px 20px;
  animation:fadeUp 0.8s ease;
}
.intro h1{
  font-family:'Fraunces',serif;
  font-weight:900;
  font-size:clamp(40px,6vw,72px);
  line-height:1;
  margin-bottom:16px;
  background:linear-gradient(135deg, #fff5e8 0%, var(--accent-2) 50%, var(--accent) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.intro .tagline{
  font-size:18px;
  color:var(--muted);
  margin-bottom:40px;
  letter-spacing:1px;
}
.intro .stats{
  display:flex;
  justify-content:center;
  gap:30px;
  margin-bottom:40px;
  flex-wrap:wrap;
}
.stat{
  padding:20px 30px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  min-width:140px;
}
.stat .num{
  font-family:'Fraunces',serif;
  font-weight:900;
  font-size:36px;
  color:var(--accent-2);
}
.stat .lbl{
  font-size:12px;
  color:var(--muted);
  letter-spacing:2px;
  text-transform:uppercase;
}
.btn-start{
  background:linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  color:#0b0710;
  border:none;
  padding:18px 50px;
  font-family:'Outfit',sans-serif;
  font-weight:700;
  font-size:18px;
  letter-spacing:2px;
  text-transform:uppercase;
  border-radius:50px;
  cursor:pointer;
  transition:all 0.3s ease;
  box-shadow:0 10px 40px rgba(255,77,61,0.4);
}
.btn-start:hover{
  transform:translateY(-3px);
  box-shadow:0 15px 50px rgba(255,77,61,0.6);
}

/* Quiz */
.quiz{
  display:none;
  animation:fadeUp 0.6s ease;
}
.quiz.active{display:block}

.progress-bar{
  height:6px;
  background:rgba(255,255,255,0.08);
  border-radius:3px;
  overflow:hidden;
  margin-bottom:30px;
  position:relative;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg, var(--accent), var(--accent-2));
  width:0%;
  transition:width 0.5s ease;
  border-radius:3px;
  box-shadow:0 0 15px var(--accent);
}

.question-meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}
.q-num{
  font-family:'Fraunces',serif;
  font-weight:900;
  font-size:14px;
  letter-spacing:3px;
  color:var(--accent-2);
  text-transform:uppercase;
}
.score-display{
  font-size:14px;
  color:var(--muted);
}
.score-display strong{
  color:var(--success);
  font-family:'Fraunces',serif;
  font-weight:900;
}

.question-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:40px;
  backdrop-filter:blur(20px);
  position:relative;
  overflow:hidden;
}
.question-card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background:linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
}
.q-instruction{
  font-size:11px;
  letter-spacing:3px;
  color:var(--accent);
  text-transform:uppercase;
  margin-bottom:12px;
  font-weight:600;
}
.question-text{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:clamp(26px,4vw,38px);
  line-height:1.3;
  margin-bottom:36px;
  color:var(--fg);
}
.question-text .highlight{
  color:var(--accent-2);
}

.choices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
@media(max-width:640px){
  .choices{grid-template-columns:1fr}
}
.choice{
  background:rgba(255,255,255,0.03);
  border:1.5px solid rgba(255,255,255,0.08);
  padding:18px 22px;
  border-radius:14px;
  cursor:pointer;
  transition:all 0.25s ease;
  display:flex;
  align-items:center;
  gap:14px;
  font-size:18px;
  font-family:'Outfit',sans-serif;
  color:var(--fg);
  text-align:left;
}
.choice:hover:not(:disabled){
  border-color:var(--accent-2);
  background:rgba(255,181,71,0.06);
  transform:translateX(4px);
}
.choice .letter{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:36px;height:36px;
  border-radius:50%;
  background:rgba(255,255,255,0.06);
  font-family:'Fraunces',serif;
  font-weight:900;
  font-size:16px;
  color:var(--accent-2);
  flex-shrink:0;
  transition:all 0.25s ease;
}
.choice:hover:not(:disabled) .letter{
  background:var(--accent-2);
  color:#0b0710;
}
.choice.correct{
  border-color:var(--success);
  background:rgba(61,220,132,0.12);
  animation:correctPulse 0.6s ease;
}
.choice.correct .letter{
  background:var(--success);
  color:#0b0710;
}
.choice.wrong{
  border-color:var(--error);
  background:rgba(255,71,87,0.12);
  animation:wrongShake 0.5s ease;
}
.choice.wrong .letter{
  background:var(--error);
  color:#fff;
}
.choice:disabled{cursor:not-allowed;opacity:0.5}
.choice.correct:disabled,.choice.wrong:disabled{opacity:1}

@keyframes correctPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.04)}
}
@keyframes wrongShake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  75%{transform:translateX(6px)}
}

/* Feedback */
.feedback{
  margin-top:30px;
  padding:24px;
  border-radius:16px;
  text-align:center;
  display:none;
  animation:fadeUp 0.4s ease;
}
.feedback.show{display:block}
.feedback.success{
  background:linear-gradient(135deg, rgba(61,220,132,0.15), rgba(61,220,132,0.05));
  border:1px solid var(--success);
}
.feedback.error{
  background:linear-gradient(135deg, rgba(255,71,87,0.15), rgba(255,71,87,0.05));
  border:1px solid var(--error);
}
.feedback .title{
  font-family:'Fraunces',serif;
  font-weight:900;
  font-size:32px;
  margin-bottom:8px;
}
.feedback.success .title{
  color:var(--success);
  text-shadow:0 0 30px rgba(61,220,132,0.5);
}
.feedback.error .title{
  color:var(--error);
  text-shadow:0 0 30px rgba(255,71,87,0.5);
}
.feedback .msg{
  color:var(--muted);
  font-size:15px;
}
.feedback .msg strong{color:var(--fg)}

.btn-next{
  margin-top:24px;
  background:transparent;
  color:var(--accent-2);
  border:1.5px solid var(--accent-2);
  padding:12px 36px;
  font-family:'Outfit',sans-serif;
  font-weight:600;
  font-size:14px;
  letter-spacing:2px;
  text-transform:uppercase;
  border-radius:50px;
  cursor:pointer;
  transition:all 0.3s ease;
}
.btn-next:hover{
  background:var(--accent-2);
  color:#0b0710;
}

/* Final screen */
.final{
  display:none;
  text-align:center;
  padding:40px 20px;
  animation:fadeUp 0.8s ease;
}
.final.active{display:block}
.final h2{
  font-family:'Fraunces',serif;
  font-weight:900;
  font-size:clamp(36px,5vw,60px);
  margin-bottom:20px;
  background:linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.final-score{
  font-family:'Fraunces',serif;
  font-weight:900;
  font-size:80px;
  color:var(--success);
  margin:20px 0;
  text-shadow:0 0 40px rgba(61,220,132,0.4);
}
.final-msg{
  font-size:18px;
  color:var(--muted);
  margin-bottom:40px;
}
.btn-restart{
  background:linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  color:#0b0710;
  border:none;
  padding:16px 40px;
  font-weight:700;
  font-size:16px;
  letter-spacing:2px;
  text-transform:uppercase;
  border-radius:50px;
  cursor:pointer;
  transition:all 0.3s ease;
}
.btn-restart:hover{transform:translateY(-3px)}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

/* Confetti */
.confetti{
  position:fixed;
  width:10px;height:10px;
  pointer-events:none;
  z-index:1000;
}

/* Sound toggle */
.sound-toggle{
  position:fixed;
  bottom:20px;right:20px;
  width:50px;height:50px;
  border-radius:50%;
  background:var(--card);
  border:1px solid var(--border);
  color:var(--accent-2);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  z-index:50;
  backdrop-filter:blur(10px);
  transition:all 0.3s ease;
}
.sound-toggle:hover{transform:scale(1.1)}
</style>
</head>
<body>

<div class="bg-canvas"></div>
<div class="bg-symbols" id="bgSymbols"></div>

<header>
  <div class="logo-wrap">
    <img src="https://z-cdn-media.chatglm.cn/files/09a73e81-6b04-4f97-9953-92dd1ce939b2.png?auth_key=1885443716-21dd0567c2d642e5a30c893b86db854e-0-166e59f43f6e1d96aa8832a8d577318e" alt="Logo Douma Ali" class="logo-img">
    <div class="logo-text">
      <span class="name">Douma Ali</span>
      <span class="sub">Mathématiques</span>
    </div>
  </div>
  <div class="prof">
    <div class="label">Professeur</div>
    <div class="name">Douma Ali</div>
  </div>
</header>

<main>
  <!-- Écran d'accueil -->
  <section class="intro" id="intro">
    <h1>Factorisation<br>& Développement</h1>
    <p class="tagline">QCM de Mathématiques — Niveau Collège</p>
    <div class="stats">
      <div class="stat">
        <div class="num">20</div>
        <div class="lbl">Questions</div>
      </div>
      <div class="stat">
        <div class="num">4</div>
        <div class="lbl">Choix</div>
      </div>
      <div class="stat">
        <div class="num">100</div>
        <div class="lbl">Points</div>
      </div>
    </div>
    <button class="btn-start" id="btnStart">Commencer le QCM</button>
  </section>

  <!-- Quiz -->
  <section class="quiz" id="quiz">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="question-meta">
      <div class="q-num" id="qNum">Question 1 / 20</div>
      <div class="score-display">Score : <strong id="scoreDisplay">0</strong> / 20</div>
    </div>
    <div class="question-card">
      <div class="q-instruction" id="qInstruction">Développer et réduire</div>
      <div class="question-text" id="questionText"></div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback">
        <div class="title" id="feedbackTitle"></div>
        <div class="msg" id="feedbackMsg"></div>
        <button class="btn-next" id="btnNext">Question suivante →</button>
      </div>
    </div>
  </section>

  <!-- Écran final -->
  <section class="final" id="final">
    <h2>Quiz Terminé !</h2>
    <div class="final-score" id="finalScore">0/20</div>
    <p class="final-msg" id="finalMsg"></p>
    <button class="btn-restart" id="btnRestart">Recommencer</button>
  </section>
</main>

<button class="sound-toggle" id="soundToggle" title="Activer/désactiver le son">
  <i class="fa-solid fa-volume-high"></i>
</button>

<script>
// ============================================
// QUESTIONS
// ============================================
const questions = [
  {
    instruction:"Développer et réduire",
    q:"3(x + 2) = ?",
    choices:["3x + 2","3x + 6","3x + 5","x + 6"],
    correct:1
  },
  {
    instruction:"Développer et réduire",
    q:"(x + 1)(x + 2) = ?",
    choices:["x² + 3x + 2","x² + 2x + 2","x² + 3x + 1","x² + 2"],
    correct:0
  },
  {
    instruction:"Factoriser",
    q:"5x + 5 = ?",
    choices:["5(x + 5)","x(5 + 1)","5(x + 1)","5x(x + 1)"],
    correct:2
  },
  {
    instruction:"Factoriser (identité remarquable)",
    q:"x² − 9 = ?",
    choices:["(x − 3)²","(x + 3)(x − 3)","(x + 9)(x − 1)","(x − 3)"],
    correct:1
  },
  {
    instruction:"Développer (identité remarquable)",
    q:"(x + 3)² = ?",
    choices:["x² + 9","x² + 6x + 9","x² + 3x + 9","x² + 6x + 3"],
    correct:1
  },
  {
    instruction:"Développer (identité remarquable)",
    q:"(x − 5)² = ?",
    choices:["x² − 25","x² − 5x + 25","x² + 10x − 25","x² − 10x + 25"],
    correct:3
  },
  {
    instruction:"Factoriser (identité remarquable)",
    q:"x² + 2x + 1 = ?",
    choices:["(x + 1)²","(x + 2)²","(x − 1)²","(x + 1)(x + 2)"],
    correct:0
  },
  {
    instruction:"Factoriser (identité remarquable)",
    q:"4x² − 12x + 9 = ?",
    choices:["(2x + 3)²","(2x − 3)²","(2x − 9)²","(4x − 3)²"],
    correct:1
  },
  {
    instruction:"Développer et réduire",
    q:"(2x − 1)(3x + 4) = ?",
    choices:["6x² + 5x − 4","6x² + 8x − 3","6x² + 5x + 4","6x² − 5x − 4"],
    correct:0
  },
  {
    instruction:"Factoriser (différence de carrés)",
    q:"9x² − 16 = ?",
    choices:["(3x − 4)²","(3x + 4)(3x − 4)","(9x − 4)(x + 4)","(3x − 4)(3x − 4)"],
    correct:1
  },
  {
    instruction:"Développer et réduire",
    q:"−2(x − 3) = ?",
    choices:["−2x − 6","−2x + 6","2x − 6","−2x − 3"],
    correct:1
  },
  {
    instruction:"Factoriser",
    q:"3x(x + 2) + 3(x + 2) = ?",
    choices:["3(x + 2)(x + 1)","3x(x + 2)","3(x + 2)","6(x + 2)"],
    correct:0
  },
  {
    instruction:"Développer (identité remarquable)",
    q:"(x + 7)(x − 7) = ?",
    choices:["x² − 49","x² + 49","x² − 14x − 49","x² − 7"],
    correct:0
  },
  {
    instruction:"Factoriser (différence de carrés)",
    q:"25 − 9x² = ?",
    choices:["(5 − 3x)(5 + 3x)","(5 − 9x)(5 + x)","(5 − 3x)²","(25 − 3x)(1 + 3x)"],
    correct:0
  },
  {
    instruction:"Développer et réduire",
    q:"2(x + 1) + (x + 3) = ?",
    choices:["3x + 5","2x + 5","3x + 4","3x + 2"],
    correct:0
  },
  {
    instruction:"Factoriser (identité remarquable)",
    q:"x² − 6x + 9 = ?",
    choices:["(x − 3)²","(x + 3)²","(x − 9)²","(x − 3)(x + 3)"],
    correct:0
  },
  {
    instruction:"Développer (identité remarquable)",
    q:"(3x + 2)² = ?",
    choices:["9x² + 12x + 4","9x² + 4","9x² + 6x + 4","3x² + 12x + 4"],
    correct:0
  },
  {
    instruction:"Factoriser (facteur commun)",
    q:"7x − 7 = ?",
    choices:["7(x − 1)","7(x − 7)","x(7 − 7)","7x(x − 1)"],
    correct:0
  },
  {
    instruction:"Développer (différence de carrés)",
    q:"(x + 4)(x − 4) = ?",
    choices:["x² − 16","x² + 16","x² − 8x − 16","x² − 4x − 16"],
    correct:0
  },
  {
    instruction:"Factoriser (identité remarquable)",
    q:"(2x + 1)² − 9 = ?",
    choices:["(2x − 2)(2x + 4)","(2x − 8)(2x + 10)","(2x + 4)(2x − 4)","(2x − 2)(2x − 4)"],
    correct:0
  }
];

// ============================================
// AUDIO (Web Audio API)
// ============================================
let audioCtx = null;
let soundEnabled = true;

function initAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playNote(freq, startTime, duration, type='sine', volume=0.3){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(volume, startTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration);
}

function playSuccessMelody(){
  if(!soundEnabled) return;
  initAudio();
  const now = audioCtx.currentTime;
  // Mélodie joyeuse ascendante (do-mi-sol-do)
  const notes = [523.25, 659.25, 783.99, 1046.50];
  notes.forEach((f,i)=>{
    playNote(f, now + i*0.12, 0.3, 'triangle', 0.25);
  });
  // Note finale plus longue
  playNote(1046.50, now + 0.48, 0.6, 'triangle', 0.3);
}

function playErrorMelody(){
  if(!soundEnabled) return;
  initAudio();
  const now = audioCtx.currentTime;
  // Son descendant type "buzzer"
  playNote(311.13, now, 0.25, 'sawtooth', 0.2);
  playNote(261.63, now + 0.2, 0.4, 'sawtooth', 0.2);
  // Un deuxième ton plus grave pour effet dramatique
  playNote(155.56, now + 0.2, 0.4, 'square', 0.1);
}

function playClickSound(){
  if(!soundEnabled) return;
  initAudio();
  const now = audioCtx.currentTime;
  playNote(880, now, 0.05, 'sine', 0.1);
}

function playFinishSound(){
  if(!soundEnabled) return;
  initAudio();
  const now = audioCtx.currentTime;
  const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
  notes.forEach((f,i)=>{
    playNote(f, now + i*0.15, 0.4, 'triangle', 0.25);
  });
}

// ============================================
// QUIZ LOGIC
// ============================================
let currentQ = 0;
let score = 0;
let answered = false;

const intro = document.getElementById('intro');
const quiz = document.getElementById('quiz');
const final = document.getElementById('final');
const qNum = document.getElementById('qNum');
const qInstruction = document.getElementById('qInstruction');
const questionText = document.getElementById('questionText');
const choicesEl = document.getElementById('choices');
const feedback = document.getElementById('feedback');
const feedbackTitle = document.getElementById('feedbackTitle');
const feedbackMsg = document.getElementById('feedbackMsg');
const btnNext = document.getElementById('btnNext');
const btnStart = document.getElementById('btnStart');
const btnRestart = document.getElementById('btnRestart');
const progressFill = document.getElementById('progressFill');
const scoreDisplay = document.getElementById('scoreDisplay');
const finalScore = document.getElementById('finalScore');
const finalMsg = document.getElementById('finalMsg');
const soundToggle = document.getElementById('soundToggle');

function startQuiz(){
  initAudio();
  intro.style.display = 'none';
  quiz.classList.add('active');
  currentQ = 0;
  score = 0;
  loadQuestion();
}

function loadQuestion(){
  answered = false;
  const q = questions[currentQ];
  qNum.textContent = `Question ${currentQ + 1} / 20`;
  qInstruction.textContent = q.instruction;
  
  // Mettre en valeur les expressions mathématiques
  const formattedQ = q.q.replace(/(x²|[0-9x+\-=()²]+)/g, (match)=>{
    return match;
  });
  questionText.innerHTML = q.q;
  
  choicesEl.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.choices.forEach((choice, i)=>{
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.innerHTML = `<span class="letter">${letters[i]}</span><span>${choice}</span>`;
    btn.onclick = ()=>selectAnswer(i, btn);
    choicesEl.appendChild(btn);
  });
  
  feedback.classList.remove('show','success','error');
  
  // Progress bar
  const progress = ((currentQ) / 20) * 100;
  progressFill.style.width = progress + '%';
  
  scoreDisplay.textContent = score;
}

function selectAnswer(index, btn){
  if(answered) return;
  answered = true;
  
  const q = questions[currentQ];
  const allChoices = document.querySelectorAll('.choice');
  allChoices.forEach(c=>c.disabled = true);
  
  if(index === q.correct){
    btn.classList.add('correct');
    score++;
    scoreDisplay.textContent = score;
    feedback.classList.add('show','success');
    feedbackTitle.textContent = "Bravo !";
    feedbackMsg.innerHTML = "Excellente réponse ! Continuez sur cette lancée.";
    playSuccessMelody();
    spawnConfetti();
  } else {
    btn.classList.add('wrong');
    // Montrer la bonne réponse
    allChoices[q.correct].classList.add('correct');
    feedback.classList.add('show','error');
    feedbackTitle.textContent = "Réponse fausse";
    const correctText = q.choices[q.correct];
    feedbackMsg.innerHTML = `La bonne réponse était : <strong>${correctText}</strong>`;
    playErrorMelody();
  }
  
  // Changer le texte du bouton à la dernière question
  if(currentQ === 19){
    btnNext.textContent = "Voir mon score →";
  } else {
    btnNext.textContent = "Question suivante →";
  }
}

function nextQuestion(){
  playClickSound();
  if(currentQ < 19){
    currentQ++;
    loadQuestion();
  } else {
    showFinal();
  }
}

function showFinal(){
  quiz.classList.remove('active');
  final.classList.add('active');
  finalScore.textContent = `${score}/20`;
  
  let msg = "";
  const pct = (score/20)*100;
  if(pct === 100) msg = "Parfait ! Vous maîtrisez parfaitement la factorisation et le développement !";
  else if(pct >= 80) msg = "Excellent travail ! Vos bases en calcul littéral sont solides.";
  else if(pct >= 60) msg = "Bon travail ! Quelques révisions sur les identités remarquables seraient utiles.";
  else if(pct >= 40) msg = "Passable. N'hésitez pas à revoir les formules de factorisation.";
  else msg = "À retravailler. Reprenez les bases du développement et de la factorisation.";
  
  finalMsg.textContent = msg;
  playFinishSound();
  if(pct >= 50) spawnConfetti(40);
}

function restart(){
  final.classList.remove('active');
  intro.style.display = 'block';
  currentQ = 0;
  score = 0;
}

// ============================================
// CONFETTI
// ============================================
function spawnConfetti(count=20){
  const colors = ['#ff4d3d','#ffb547','#3ddc84','#e8b04b','#fff5e8'];
  for(let i=0;i<count;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.left = Math.random()*100 + 'vw';
    c.style.top = '-20px';
    c.style.borderRadius = Math.random()>0.5 ? '50%' : '2px';
    c.style.width = (5 + Math.random()*8) + 'px';
    c.style.height = (5 + Math.random()*8) + 'px';
    document.body.appendChild(c);
    
    const duration = 2000 + Math.random()*2000;
    const drift = (Math.random()-0.5)*200;
    c.animate([
      {transform:`translate(0,0) rotate(0deg)`, opacity:1},
      {transform:`translate(${drift}px, 100vh) rotate(720deg)`, opacity:0}
    ], {duration, easing:'cubic-bezier(0.4,0,0.6,1)'});
    
    setTimeout(()=>c.remove(), duration);
  }
}

// ============================================
// SYMBOLS DE FOND
// ============================================
function createSymbols(){
  const container = document.getElementById('bgSymbols');
  const symbols = ['x','y','+','−','×','÷','=','x²','a²','b²','( )','√','π','∑','f(x)'];
  for(let i=0;i<25;i++){
    const s = document.createElement('div');
    s.className = 'symbol';
    s.textContent = symbols[Math.floor(Math.random()*symbols.length)];
    s.style.left = Math.random()*100 + 'vw';
    s.style.fontSize = (20 + Math.random()*50) + 'px';
    s.style.animationDuration = (15 + Math.random()*20) + 's';
    s.style.animationDelay = (Math.random()*15) + 's';
    container.appendChild(s);
  }
}

// ============================================
// EVENT LISTENERS
// ============================================
btnStart.addEventListener('click', startQuiz);
btnNext.addEventListener('click', nextQuestion);
btnRestart.addEventListener('click', restart);

soundToggle.addEventListener('click', ()=>{
  soundEnabled = !soundEnabled;
  const icon = soundToggle.querySelector('i');
  if(soundEnabled){
    icon.className = 'fa-solid fa-volume-high';
    initAudio();
    playClickSound();
  } else {
    icon.className = 'fa-solid fa-volume-xmark';
  }
});

// Init
createSymbols();
</script>
